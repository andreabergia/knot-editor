[workspace]
members = ["crates/knot-handler-macros"]
resolver = "3"

[package]
name = "knot"
version = "0.1.0"
edition = "2024"

[dependencies]
inventory = "0.3"
knot-handler-macros = { path = "crates/knot-handler-macros" }
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1"
directories = "6"
gpui = { version = "0.2", default-features = false, features = ["font-kit", "windows-manifest"] }
jsonc-parser = { version = "0.34", features = ["serde"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tokio = { version = "1.53", features = ["sync"] }
tempfile = "3"
unicode-segmentation = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
v8 = "152.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }

[dev-dependencies]
pollster = "1"
gpui = { version = "0.2", default-features = false, features = ["font-kit", "test-support", "windows-manifest"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "0.2", default-features = false, features = ["wayland"] }

[lib]
name = "knot"
path = "src/lib.rs"

[[bin]]
name = "knot"
path = "src/main.rs"
