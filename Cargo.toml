[package]
name = "knot"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
cosmic-text = "0.19"
deno_core = "0.408"
deno_error = "0.7"
gpui = { version = "0.2", default-features = false, features = ["font-kit", "windows-manifest"] }
pollster = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
tokio = { version = "1.53", features = ["rt-multi-thread", "sync", "time"] }
unicode-segmentation = "1"
wgpu = "29"
winit = "0.30"

# skia backend (macOS only — Metal via raw-window-handle). Crate versions
# pinned to skia-safe 0.99's metal-window example to avoid FFI drift.
[target.'cfg(target_os = "macos")'.dependencies]
skia-safe = { version = "0.99", features = ["gpu", "metal", "textlayout"] }
objc2 = { version = "0.6.3", default-features = false }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-metal = { version = "0.3.2", default-features = false, features = ["MTLCommandBuffer", "MTLCommandQueue", "MTLDrawable", "MTLPixelFormat"] }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["objc2-core-foundation", "objc2-metal", "CAMetalLayer"] }
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["objc2-quartz-core", "NSView", "NSResponder"] }
raw-window-handle = "0.6"

[dev-dependencies]
gpui = { version = "0.2", default-features = false, features = ["font-kit", "test-support", "windows-manifest"] }

[lib]
name = "knot"
path = "src/lib.rs"

[[bin]]
name = "knot"
path = "src/main.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"

[[bin]]
name = "step3-gpui"
path = "src/step3/gpui/main.rs"

[[bin]]
name = "core-bench"
path = "src/bin/core_bench.rs"

[[bin]]
name = "anno-bench"
path = "src/bin/anno_bench.rs"

[[bin]]
name = "v8-bench"
path = "src/bin/v8_bench.rs"
