[package]
name = "knot"
version = "0.1.0"
edition = "2024"

[dependencies]
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1"
directories = "6"
gpui = { version = "0.2", default-features = false, features = ["font-kit", "windows-manifest"] }
jsonc-parser = { version = "0.34", features = ["serde"] }
pollster = "0.4"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tokio = { version = "1.53", features = ["fs", "rt-multi-thread", "sync", "time"] }
tempfile = "3"
unicode-segmentation = "1"
url = "2"
v8 = "152.2"

[dev-dependencies]
gpui = { version = "0.2", default-features = false, features = ["font-kit", "test-support", "windows-manifest"] }

[lib]
name = "knot"
path = "src/lib.rs"

[[bin]]
name = "knot"
path = "src/main.rs"
