[workspace]
members = ["crates/knot-handler-macros"]
resolver = "3"

[package]
name = "knot"
version = "0.1.0"
edition = "2024"

[dependencies]
inventory = "0.3"
knot-handler-macros = { path = "crates/knot-handler-macros" }
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1"
directories = "6"
gpui = { version = "0.2", default-features = false, features = ["font-kit", "windows-manifest"] }
libc = "0.2"
jsonc-parser = { version = "0.34", features = ["serde"] }
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tokio = { version = "1.53", features = ["sync"] }
tempfile = "3"
unicode-segmentation = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }
v8 = "152.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tree-sitter = "0.27"
tree-sitter-html = "0.23.2"
tree-sitter-css = "0.25.0"
tree-sitter-javascript = "0.25.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-rust = "0.24.2"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25.0"
tree-sitter-java = "0.23.5"
tree-sitter-python = "0.25.0"
tree-sitter-bash = "0.25.1"
tree-sitter-json = "0.24.8"
tree-sitter-toml-ng = "0.7.0"
tree-sitter-yaml = "0.7.2"
tree-sitter-md = "0.5.4"
tree-sitter-tsquery = "0.8.0"
nucleo-matcher = "0.3.1"

[dev-dependencies]
pollster = "1"
gpui = { version = "0.2", default-features = false, features = ["font-kit", "test-support", "windows-manifest"] }

[target.'cfg(target_os = "linux")'.dependencies]
gpui = { version = "0.2", default-features = false, features = ["wayland"] }

[lib]
name = "knot"
path = "src/lib.rs"

[[bin]]
name = "knot"
path = "src/main.rs"

# Startup compiles every bundled highlight query; unoptimized, the query
# compiler takes seconds, so debug builds and tests optimize the runtime.
[profile.dev.package.tree-sitter]
opt-level = 3
